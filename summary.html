<!DOCTYPE html>
<html>
<head>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:transparent; font-family:'Oswald',sans-serif; overflow:hidden; }
.row {
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  padding:18px 0;
  border-top:1px solid rgba(255,255,255,0.07);
}
.name {
  font-size:13px;
  font-weight:600;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:rgba(200,195,190,0.7);
  flex-shrink:0;
  padding-right:24px;
}
.rule {
  flex:1;
  height:1px;
  background:rgba(255,255,255,0.06);
  margin:0 16px;
  position:relative;
  top:-3px;
}
.range {
  font-size:18px;
  font-weight:600;
  color:#ffffff;
  letter-spacing:0.04em;
  white-space:nowrap;
  flex-shrink:0;
}
.total-row {
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  padding:24px 0 0;
  border-top:2px solid #DD9C78;
  margin-top:8px;
}
.total-label {
  font-size:13px;
  font-weight:700;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:#DD9C78;
  flex-shrink:0;
  padding-right:24px;
}
.total-range {
  font-size:28px;
  font-weight:700;
  color:#ffffff;
  letter-spacing:0.04em;
  white-space:nowrap;
  flex-shrink:0;
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="summary"></div>
<script>
function fmt(n){return n.toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:0,maximumFractionDigits:0});}
function parse(str){return parseFloat((str||'').replace(/[$,]/g,''));}
function range(n){return fmt(n*0.95)+' \u2013 '+fmt(n*1.05);}
function build(){
  try {
    var rows=[...window.parent.document.querySelectorAll('tr.ng-star-inserted')];
    var data=rows.map(function(row){
      var cells=[...row.querySelectorAll('td')];
      if(cells.length<2)return null;
      var name=cells[0].innerText.trim();
      var total=cells[cells.length-1].innerText.trim();
      if(!name||!total.includes('$'))return null;
      if(name==='Estimated Total')return null;
      return {name:name,val:parse(total)};
    }).filter(Boolean);
    var grandTotal=data.reduce(function(s,r){return s+r.val;},0);
    var html=data.map(function(r){
      return '<div class="row"><span class="name">'+r.name+'</span><span class="rule"></span><span class="range">'+range(r.val)+'</span></div>';
    }).join('');
    html+='<div class="total-row"><span class="total-label">Total Investment</span><span class="rule" style="background:rgba(221,156,120,0.2)"></span><span class="total-range">'+range(grandTotal)+'</span></div>';
    document.getElementById('summary').innerHTML=html;
    try{
      var iframes=[...window.parent.document.querySelectorAll('iframe')];
      var me=iframes.find(function(f){return f.src&&f.src.includes('summary');});
      if(me)me.style.height=(document.body.scrollHeight+10)+'px';
    }catch(e){}
  }catch(e){setTimeout(build,500);}
}
setTimeout(build,1500);
</script>
</body>
</html>
